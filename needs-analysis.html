<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riya — Needs Analysis</title>
<style>
  :root {
    --navy: #1B2A4A;
    --gold: #C9A84C;
    --light: #F5F6FA;
    --border: #DDE1EC;
    --ink: #1a1a2e;
    --muted: #6b7280;
    --mono: 'Courier New', monospace;
    --sans: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--light); color: var(--ink); min-height: 100vh; }

  .header { background: var(--navy); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { color: white; font-size: 20px; font-weight: 700; }
  .header span { color: var(--gold); font-size: 13px; }

  .token-bar { background: white; border-bottom: 1px solid var(--border); padding: 12px 32px; display: flex; align-items: center; gap: 12px; }
  .token-bar input { border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; font-size: 13px; font-family: var(--mono); width: 220px; }
  .token-bar button { background: var(--navy); color: white; border: none; border-radius: 4px; padding: 6px 16px; font-size: 13px; cursor: pointer; }
  .credits-badge { font-size: 12px; color: var(--muted); font-family: var(--mono); }

  .main { display: flex; gap: 0; min-height: calc(100vh - 110px); }
  .left-panel { width: 420px; min-width: 420px; background: white; border-right: 1px solid var(--border); padding: 24px; overflow-y: auto; }
  .right-panel { flex: 1; padding: 24px; overflow-y: auto; }

  .section-label { font-size: 10px; font-family: var(--mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; margin-top: 20px; display: block; }
  .section-label:first-child { margin-top: 0; }

  .field-group { margin-bottom: 14px; }
  .field-group label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .field-group input, .field-group select, .field-group textarea { width: 100%; border: 1px solid var(--border); border-radius: 4px; padding: 7px 10px; font-size: 13px; font-family: var(--sans); background: white; }
  .field-group textarea { min-height: 70px; resize: vertical; }

  .smart-input-area { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
  .smart-tabs { display: flex; background: var(--light); border-bottom: 1px solid var(--border); }
  .smart-tab { padding: 8px 14px; font-size: 12px; font-family: var(--mono); cursor: pointer; border: none; background: none; color: var(--muted); border-bottom: 2px solid transparent; }
  .smart-tab.active { color: var(--navy); border-bottom-color: var(--gold); font-weight: 600; }
  .smart-tab-content { padding: 12px; display: none; }
  .smart-tab-content.active { display: block; }
  .smart-tab-content textarea { width: 100%; border: 1px solid var(--border); border-radius: 4px; padding: 8px; font-size: 12px; min-height: 100px; resize: vertical; font-family: var(--sans); }

  .si-status { font-size: 11px; margin-top: 6px; color: var(--muted); min-height: 16px; }
  .si-status.ok { color: #166534; }
  .si-status.bad { color: #991b1b; }

  .btn-extract { width: 100%; background: var(--light); border: 1px solid var(--border); border-radius: 4px; padding: 8px; font-size: 12px; font-family: var(--mono); cursor: pointer; color: var(--navy); margin-bottom: 4px; }
  .btn-extract:hover { background: var(--border); }
  .btn-extract:disabled { opacity: 0.5; cursor: not-allowed; }

  .voice-row { display: flex; gap: 6px; margin-top: 8px; }
  .voice-row button { flex: 1; padding: 7px 8px; font-size: 12px; font-family: var(--mono); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: white; color: var(--navy); }
  .voice-lang { font-size: 12px; border: 1px solid var(--border); border-radius: 4px; padding: 5px 6px; font-family: var(--mono); }

  .btn-generate { width: 100%; background: var(--navy); color: white; border: none; border-radius: 4px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px; }
  .btn-generate:hover { background: #253d6e; }
  .btn-generate:disabled { background: var(--muted); cursor: not-allowed; }

  .lang-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .lang-row label { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .lang-row select { border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-size: 12px; font-family: var(--mono); }

  .output-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 24px; min-height: 400px; }
  .output-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; color: var(--muted); gap: 12px; }
  .output-placeholder svg { opacity: 0.3; }
  .output-text { font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; font-family: var(--sans); }

  .output-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn-action { background: white; border: 1px solid var(--border); border-radius: 4px; padding: 7px 14px; font-size: 12px; cursor: pointer; color: var(--navy); }
  .btn-action:hover { background: var(--light); }
  .btn-action.primary { background: var(--navy); color: white; border-color: var(--navy); }

  .section-heading { font-weight: 700; color: var(--navy); font-size: 13px; margin-top: 16px; margin-bottom: 4px; border-bottom: 1px solid var(--gold); padding-bottom: 3px; }

  .review-banner { background: #FFF8E6; border: 1px solid var(--gold); border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; font-size: 12px; color: #7a5c00; }
  .review-banner strong { display: block; margin-bottom: 6px; }
  .review-banner ul { padding-left: 16px; }

  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .checkbox-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--navy); }
  .checkbox-row label { font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <h1>Riya — Needs Analysis</h1>
  <span>FAIS-Compliant Needs Analysis Generator</span>
</div>

<div class="token-bar">
  <input type="text" id="tokenInput" placeholder="Broker token (e.g. RIYA-GOMES-001)" />
  <button onclick="setToken()">Login</button>
  <span class="credits-badge" id="creditsBadge"></span>
</div>

<div class="main">
  <!-- LEFT PANEL -->
  <div class="left-panel">

    <span class="section-label">Smart Input</span>
    <div class="smart-input-area">
      <div class="smart-tabs">
        <button class="smart-tab active" onclick="switchTab(event,'paste')">Paste Text</button>
        <button class="smart-tab" onclick="switchTab(event,'file')">Upload File</button>
        <button class="smart-tab" onclick="switchTab(event,'voice')">Voice Note</button>
      </div>

      <!-- PASTE TEXT -->
      <div class="smart-tab-content active" id="tab-paste">
        <textarea id="pasteText" placeholder="Paste client notes, email, or any information here..."></textarea>
        <button class="btn-extract" onclick="extractFromPaste()">⚡ Extract & Populate</button>
        <div class="si-status" id="pasteStatus"></div>
      </div>

      <!-- UPLOAD FILE -->
      <div class="smart-tab-content" id="tab-file">
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt" multiple style="font-size:12px;width:100%;" />
        <p style="font-size:11px;color:var(--muted);margin-top:6px;">PDF, Word, or text. Multiple files supported.</p>
        <button class="btn-extract" style="margin-top:8px;" id="btnExtractFile" onclick="extractFromFile()">⚡ Extract & Populate</button>
        <div class="si-status" id="fileStatus"></div>
      </div>

      <!-- VOICE NOTE -->
      <div class="smart-tab-content" id="tab-voice">
        <div class="voice-row">
          <button id="recordBtn" onclick="toggleRecording()">🎤 Start Recording</button>
          <input type="file" id="audioInput" accept="audio/*" style="font-size:11px;flex:1;" />
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
          <label style="font-size:11px;color:var(--muted);">Language:</label>
          <select class="voice-lang" id="voiceLang">
            <option value="">Auto-detect</option>
            <option value="en">English</option>
            <option value="af">Afrikaans</option>
          </select>
        </div>
        <button class="btn-extract" style="margin-top:8px;" id="btnExtractVoice" onclick="extractFromVoice()">⚡ Transcribe & Extract</button>
        <div class="si-status" id="voiceStatus"></div>
      </div>
    </div>

    <span class="section-label">FSP & Representative</span>
    <div class="field-group"><label>Broker Name / FSP</label><input type="text" id="brokerName" /></div>
    <div class="field-group"><label>FSP Number</label><input type="text" id="fspNumber" /></div>
    <div class="field-group"><label>Representative Name</label><input type="text" id="advisorName" /></div>
    <div class="field-group"><label>Compliance Officer</label><input type="text" id="complianceOfficer" /></div>
    <div class="field-group"><label>Advice Date</label><input type="date" id="adviceDate" /></div>
    <div class="field-group"><label>Communication Method</label><input type="text" id="commsMethod" placeholder="e.g. Personal visit, email, telephone" /></div>

    <span class="section-label">Client Details</span>
    <div class="field-group"><label>Client Name</label><input type="text" id="clientName" /></div>
    <div class="field-group"><label>ID / Registration Number</label><input type="text" id="clientId" /></div>
    <div class="field-group"><label>Contact Number</label><input type="text" id="clientContact" /></div>
    <div class="field-group"><label>Email Address</label><input type="text" id="clientEmail" /></div>
    <div class="field-group"><label>Address</label><input type="text" id="clientAddress" /></div>
    <div class="field-group"><label>Occupation</label><input type="text" id="clientOccupation" /></div>

    <span class="section-label">Motor Vehicles</span>
    <div class="field-group"><label>Vehicle 1 (Year Make Model)</label><input type="text" id="vehicle1" placeholder="2022 Toyota Hilux 2.8 GD-6" /></div>
    <div class="field-group"><label>Vehicle 1 Use</label>
      <select id="vehicle1use"><option>Private</option><option>Business</option><option>Commercial</option></select>
    </div>
    <div class="field-group"><label>Vehicle 1 Value (R)</label><input type="text" id="vehicle1value" /></div>
    <div class="field-group"><label>Vehicle 2 (Year Make Model)</label><input type="text" id="vehicle2" /></div>
    <div class="field-group"><label>Vehicle 2 Value (R)</label><input type="text" id="vehicle2value" /></div>

    <span class="section-label">Buildings</span>
    <div class="field-group"><label>Property Type</label>
      <select id="buildType"><option value="">-- Select --</option><option>Freehold property</option><option>Sectional title</option><option>Tenant</option></select>
    </div>
    <div class="field-group"><label>Rebuild Value (R)</label><input type="text" id="buildValue" /></div>
    <div class="field-group"><label>Security Measures</label><input type="text" id="buildSecurity" placeholder="e.g. Alarm, electric fence, security gates" /></div>

    <span class="section-label">Contents</span>
    <div class="field-group"><label>Contents Value (R)</label><input type="text" id="contentsValue" /></div>
    <div class="field-group"><label>Specified / Scheduled Items</label><textarea id="specifiedItems" placeholder="e.g. Laptop R25000; Watch R45000; Camera R18000"></textarea></div>

    <span class="section-label">Liability</span>
    <div class="field-group"><label>Personal Liability Limit (R)</label><input type="text" id="liabilityLimit" /></div>

    <span class="section-label">Existing Cover & Gaps</span>
    <div class="field-group"><label>Existing Policies</label><textarea id="existingCover" placeholder="Insurer, policy number, expiry date"></textarea></div>
    <div class="field-group"><label>Identified Gaps</label><textarea id="coverGaps" placeholder="No cover for..."></textarea></div>

    <span class="section-label">KYC / FICA / POPIA</span>
    <div class="checkbox-row"><input type="checkbox" id="kycId" /><label for="kycId">ID verified — certified copy on file</label></div>
    <div class="checkbox-row"><input type="checkbox" id="kycAddr" /><label for="kycAddr">Proof of address on file (not older than 3 months)</label></div>
    <div class="checkbox-row"><input type="checkbox" id="popia" /><label for="popia">POPIA consent signed</label></div>
    <div class="checkbox-row"><input type="checkbox" id="faisDisc" /><label for="faisDisc">FAIS disclosure provided and acknowledged</label></div>
    <div class="field-group"><label>Claims History Note</label><input type="text" id="claimsNotes" placeholder="e.g. No material claims" /></div>

    <div class="lang-row">
      <label>Output Language</label>
      <select id="naLanguage">
        <option value="en">English</option>
        <option value="af">Afrikaans</option>
      </select>
    </div>

    <button class="btn-generate" id="btnGenerate" onclick="generateNA()">Generate Needs Analysis</button>

  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="output-card">
      <div id="outputBody">
        <div class="output-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <p>Fill in the form and click <strong>Generate</strong></p>
        </div>
      </div>
      <div id="outputActions" class="output-actions" style="display:none;">
        <button class="btn-action" onclick="copyText()">Copy Text</button>
        <button class="btn-action primary" onclick="downloadPDF()">Download PDF</button>
        <button class="btn-action" onclick="emailBroker()">Email to Broker</button>
      </div>
    </div>
  </div>
</div>

<script>
const BACKEND = 'https://riya-backend-production.up.railway.app';
let brokerToken = localStorage.getItem('riya_na_token') || '';
let generatedText = '';
let mediaRecorder = null;
let recordedChunks = [];
let recordedBlob = null;

function setToken() {
  brokerToken = document.getElementById('tokenInput').value.trim();
  if (!brokerToken) return;
  localStorage.setItem('riya_na_token', brokerToken);
  checkCredits();
}

async function checkCredits() {
  try {
    const res = await fetch(BACKEND + '/credits?token=' + brokerToken);
    const data = await res.json();
    if (data.credits !== undefined)
      document.getElementById('creditsBadge').textContent = 'Credits: ' + data.credits;
  } catch(e) {}
}

function switchTab(e, tab) {
  document.querySelectorAll('.smart-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.smart-tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  e.target.classList.add('active');
}

function getVal(id) {
  const el = document.getElementById(id);
  if (!el) return '';
  if (el.type === 'checkbox') return el.checked ? 'Yes — confirmed' : 'No';
  return el.value || '';
}

function setStatus(id, msg, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = 'si-status' + (cls ? ' ' + cls : '');
}

function blobToBase64(blob) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onloadend = function() { resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function populateForm(f) {
  const set = function(id, val) { const el = document.getElementById(id); if (el && val) el.value = val; };
  set('brokerName', f.brokerName);
  set('fspNumber', f.fspNumber);
  set('advisorName', f.advisorName);
  set('complianceOfficer', f.complianceOfficer);
  set('commsMethod', f.clientCommsMethod);
  set('clientName', f.clientName);
  set('clientId', f.clientReg || f.clientId);
  set('clientContact', f.clientContact);
  set('clientEmail', f.clientEmail);
  set('clientAddress', f.clientAddress);
  set('clientOccupation', f.clientOccupation);
  set('buildValue', f.buildValue);
  set('buildSecurity', f.buildSecurity);
  set('contentsValue', f.contentsSumInsured || f.contentsValue);
  set('specifiedItems', f.scheduledItems || f.specifiedItems);
  set('existingCover', f.existingCover);
  set('coverGaps', f.coverGaps);
  set('liabilityLimit', f.publicLiabilityLimit || f.liabilityLimit);
  set('claimsNotes', f.claimsNotes);

  if (f.vehicles && f.vehicles.length > 0) {
    const v1 = f.vehicles[0];
    document.getElementById('vehicle1').value = [v1.year, v1.make, v1.model].filter(Boolean).join(' ');
    if (v1.retailValue || v1.sumInsured) document.getElementById('vehicle1value').value = v1.retailValue || v1.sumInsured;
    if (v1.primaryUse) {
      const use = v1.primaryUse.toLowerCase();
      document.getElementById('vehicle1use').value = (use.includes('private') || use.includes('privaat')) ? 'Private' : use.includes('commercial') ? 'Commercial' : 'Business';
    }
  }
  if (f.vehicles && f.vehicles.length > 1) {
    const v2 = f.vehicles[1];
    document.getElementById('vehicle2').value = [v2.year, v2.make, v2.model].filter(Boolean).join(' ');
    if (v2.retailValue || v2.sumInsured) document.getElementById('vehicle2value').value = v2.retailValue || v2.sumInsured;
  }
}

async function callExtract(userText) {
  const res = await fetch(BACKEND + '/generate-roa', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: brokerToken || 'RIYA-TEST-0001', user: userText, mode: 'extract' })
  });
  const data = await res.json();
  const raw = data.content?.map(b => b.text || '').join('') || '';
  const start = raw.indexOf('{');
  const end = raw.lastIndexOf('}');
  if (start === -1 || end === -1) throw new Error('No JSON returned from extraction');
  return JSON.parse(raw.slice(start, end + 1));
}

async function extractFromPaste() {
  const text = document.getElementById('pasteText').value.trim();
  if (!text) { setStatus('pasteStatus', 'Paste some text first.', 'bad'); return; }
  setStatus('pasteStatus', 'Extracting...');
  try {
    const f = await callExtract(text);
    populateForm(f);
    setStatus('pasteStatus', '✓ Extracted — review all fields before generating.', 'ok');
  } catch(e) {
    setStatus('pasteStatus', 'Extraction failed: ' + e.message, 'bad');
  }
}

async function extractFromFile() {
  const fileInput = document.getElementById('fileInput');
  const files = Array.from(fileInput.files);
  if (!files.length) { setStatus('fileStatus', 'Choose a file first.', 'bad'); return; }

  const btn = document.getElementById('btnExtractFile');
  btn.disabled = true;
  let combinedText = '';

  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      setStatus('fileStatus', 'Processing file ' + (i + 1) + ' of ' + files.length + ': ' + file.name + '...');
      const fileBase64 = await blobToBase64(file);
      const res = await fetch(BACKEND + '/extract-pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: brokerToken || 'RIYA-TEST-0001', fileBase64: fileBase64, mimeType: file.type })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'File extraction failed: ' + file.name);
      combinedText += (data.text || '') + '\n\n';
    }
    setStatus('fileStatus', 'Running field extraction...');
    const f = await callExtract(combinedText.trim());
    populateForm(f);
    setStatus('fileStatus', '✓ Extracted from ' + files.length + ' file' + (files.length > 1 ? 's' : '') + ' — review before generating.', 'ok');
    fileInput.value = '';
  } catch(e) {
    setStatus('fileStatus', 'Error: ' + e.message, 'bad');
  } finally {
    btn.disabled = false;
  }
}

async function toggleRecording() {
  const btn = document.getElementById('recordBtn');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    btn.textContent = '🎤 Start Recording';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = function() {
      stream.getTracks().forEach(function(t) { t.stop(); });
      recordedBlob = new Blob(recordedChunks, { type: 'audio/webm' });
      setStatus('voiceStatus', 'Recording captured — click Transcribe & Extract when ready.', 'ok');
    };
    mediaRecorder.start();
    btn.textContent = '⏹ Stop Recording';
    setStatus('voiceStatus', 'Recording...');
  } catch(err) {
    setStatus('voiceStatus', 'Microphone error: ' + err.message, 'bad');
  }
}

async function extractFromVoice() {
  const uploadedFile = document.getElementById('audioInput').files[0];
  const audioBlob = uploadedFile || recordedBlob;
  if (!audioBlob) { setStatus('voiceStatus', 'Record or upload a voice note first.', 'bad'); return; }

  const btn = document.getElementById('btnExtractVoice');
  btn.disabled = true;
  setStatus('voiceStatus', 'Transcribing...');

  try {
    const audioBase64 = await blobToBase64(audioBlob);
    const language = document.getElementById('voiceLang').value;
    const tRes = await fetch(BACKEND + '/transcribe-voice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: brokerToken || 'RIYA-TEST-0001', audioBase64: audioBase64, mimeType: audioBlob.type || 'audio/webm', language: language })
    });
    const tData = await tRes.json();
    if (!tRes.ok || tData.error) throw new Error(tData.error || 'Transcription failed');
    const transcript = tData.transcript || '';
    if (!transcript) throw new Error('Empty transcript returned');

    setStatus('voiceStatus', 'Extracting fields from transcript...');
    const f = await callExtract(transcript);
    populateForm(f);
    setStatus('voiceStatus', '✓ Transcribed and extracted — review all fields before generating.', 'ok');
    recordedBlob = null;
    document.getElementById('audioInput').value = '';
  } catch(e) {
    setStatus('voiceStatus', 'Error: ' + e.message, 'bad');
  } finally {
    btn.disabled = false;
  }
}

async function generateNA() {
  if (!brokerToken) { alert('Please login with your broker token first.'); return; }

  const btn = document.getElementById('btnGenerate');
  btn.disabled = true;
  btn.textContent = 'Generating...';

  document.getElementById('outputBody').innerHTML = '<div class="output-placeholder"><div class="spinner"></div><p>Riya is preparing your Needs Analysis...</p></div>';
  document.getElementById('outputActions').style.display = 'none';

  const lang = document.getElementById('naLanguage').value;
  document.getElementById('adviceDate').value = document.getElementById('adviceDate').value || new Date().toISOString().slice(0,10);

  let prompt = 'Generate a complete, FAIS-compliant NEEDS ANALYSIS document for the following client. This is NOT a Record of Advice — it is a Needs Analysis that identifies and documents the client\'s insurance needs per asset category.\n\n';
  prompt += '--- FSP DETAILS ---\n';
  prompt += 'Broker: ' + getVal('brokerName') + '\nFSP Number: ' + getVal('fspNumber') + '\nRepresentative: ' + getVal('advisorName') + '\nCompliance Officer: ' + getVal('complianceOfficer') + '\nAdvice Date: ' + getVal('adviceDate') + '\nCommunication Method: ' + getVal('commsMethod') + '\n\n';
  prompt += '--- CLIENT DETAILS ---\n';
  prompt += 'Name: ' + getVal('clientName') + '\nID/Reg: ' + getVal('clientId') + '\nContact: ' + getVal('clientContact') + '\nEmail: ' + getVal('clientEmail') + '\nAddress: ' + getVal('clientAddress') + '\nOccupation: ' + getVal('clientOccupation') + '\n\n';
  prompt += '--- KYC / FICA / POPIA ---\n';
  prompt += 'ID verified: ' + (document.getElementById('kycId').checked ? 'Yes — certified copy on file' : 'Outstanding') + '\n';
  prompt += 'Proof of address: ' + (document.getElementById('kycAddr').checked ? 'Yes — on file' : 'Outstanding') + '\n';
  prompt += 'POPIA consent: ' + (document.getElementById('popia').checked ? 'Yes — signed' : 'Outstanding') + '\n';
  prompt += 'FAIS disclosure: ' + (document.getElementById('faisDisc').checked ? 'Yes — provided and acknowledged' : 'Outstanding') + '\n';
  prompt += 'Claims history: ' + getVal('claimsNotes') + '\n\n';

  if (getVal('vehicle1')) {
    prompt += '--- MOTOR VEHICLES ---\nVehicle 1: ' + getVal('vehicle1') + ' | Use: ' + getVal('vehicle1use') + ' | Value: R' + getVal('vehicle1value') + '\n';
    if (getVal('vehicle2')) prompt += 'Vehicle 2: ' + getVal('vehicle2') + ' | Value: R' + getVal('vehicle2value') + '\n';
    prompt += '\n';
  }
  if (getVal('buildType')) {
    prompt += '--- BUILDINGS ---\nProperty type: ' + getVal('buildType') + '\nRebuild value: R' + getVal('buildValue') + '\nSecurity: ' + getVal('buildSecurity') + '\n\n';
  }
  if (getVal('contentsValue')) {
    prompt += '--- CONTENTS ---\nContents value: R' + getVal('contentsValue') + '\n';
    if (getVal('specifiedItems')) prompt += 'Specified items: ' + getVal('specifiedItems') + '\n';
    prompt += '\n';
  }
  if (getVal('liabilityLimit')) {
    prompt += '--- LIABILITY ---\nPersonal liability limit: R' + getVal('liabilityLimit') + '\n\n';
  }
  if (getVal('existingCover')) prompt += '--- EXISTING COVER ---\n' + getVal('existingCover') + '\n\n';
  if (getVal('coverGaps')) prompt += '--- IDENTIFIED GAPS ---\n' + getVal('coverGaps') + '\n\n';

  const systemPrompt = lang === 'af'
    ? 'Jy is \'n FAIS-nakomingsassistent. Stel \'n volledige, professionele Behoefteanalise op in Afrikaans. Die dokument moet dek: 1. FSP- en Verteenwoordigerbesonderhede 2. Kliëntidentifikasie, KYC, FICA en POPIA 3. Behoefteanalise per batekategorie (motor, geboue, inhoud, aanspreeklikheid) 4. Bestaande Dekking en Gapings 5. Kliënt Aanvaardingsrekord met handtekeningblok. Gebruik slegs genommerde opskrifte — geen markdown nie. Moenie fabriseer nie.'
    : 'You are a FAIS compliance assistant. Produce a complete, professional Needs Analysis document in English. The document must cover: 1. FSP and Representative Details 2. Client Identification, KYC, FICA and POPIA 3. Needs Analysis per asset category (motor, buildings, contents, liability) — each category gets its own paragraph explaining the need, the risk, and the recommended cover type 4. Existing Cover and Gaps 5. Client Acceptance Record with signature block. Use numbered headings only — no markdown. Do not fabricate — use only the information provided.';

  try {
    const res = await fetch(BACKEND + '/generate-roa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: brokerToken, user: prompt, mode: 'roa', language: lang, naMode: true })
    });
    const data = await res.json();
    generatedText = data.content?.map(b => b.text || '').join('') || '';
    renderOutput(generatedText, data.warnings || []);
    document.getElementById('outputActions').style.display = 'flex';
    checkCredits();
  } catch(e) {
    document.getElementById('outputBody').innerHTML = '<p style="color:red;padding:16px;">Generation failed: ' + e.message + '</p>';
  }

  btn.disabled = false;
  btn.textContent = 'Generate Needs Analysis';
}

function renderOutput(text, warnings) {
  let html = '';
  if (warnings && warnings.length > 0) {
    html += '<div class="review-banner"><strong>Review before sending — ' + warnings.length + ' item(s) flagged:</strong><ul>';
    warnings.forEach(function(w) { html += '<li>' + w + '</li>'; });
    html += '</ul></div>';
  }
  text.split('\n').forEach(function(line) {
    const trimmed = line.trim();
    if (!trimmed) { html += '<br>'; return; }
    if (/^\d+\.\s+[A-Z\u00C0-\u024F].{2,}/.test(trimmed)) {
      html += '<div class="section-heading">' + trimmed + '</div>';
    } else {
      html += '<div class="output-text">' + trimmed + '</div>';
    }
  });
  document.getElementById('outputBody').innerHTML = html;
}

function copyText() { navigator.clipboard.writeText(generatedText); }

async function downloadPDF() {
  if (!generatedText) return;
  try {
    const res = await fetch(BACKEND + '/generate-pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: generatedText, clientName: getVal('clientName'), fspName: getVal('brokerName'), triggerLabel: 'Needs Analysis', adviceDate: getVal('adviceDate'), brokerToken: brokerToken })
    });
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'NeedsAnalysis-' + (getVal('clientName') || 'Client').replace(/\s+/g, '') + '.pdf';
    a.click();
  } catch(e) { alert('PDF download failed: ' + e.message); }
}

async function emailBroker() {
  if (!generatedText || !brokerToken) return;
  try {
    await fetch(BACKEND + '/send-roa-to-broker', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: brokerToken, roaText: generatedText, clientName: getVal('clientName'), triggerLabel: 'Needs Analysis' })
    });
    alert('Emailed to broker successfully!');
  } catch(e) { alert('Email failed: ' + e.message); }
}

window.onload = function() {
  if (brokerToken) {
    document.getElementById('tokenInput').value = brokerToken;
    checkCredits();
  }
  document.getElementById('adviceDate').value = new Date().toISOString().slice(0,10);
};
</script>
